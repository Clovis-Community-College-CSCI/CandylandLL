/* ==========================================================================
   Linked List Candyland — Main Stylesheet
   A candy-themed educational board game GUI
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap');

/* ---------- CSS Custom Properties ---------- */
:root {
    --bg-primary: #fdf2f8;
    --bg-secondary: #fff5f7;
    --bg-card: #ffffff;
    --bg-panel: rgba(255, 255, 255, 0.92);
    --text-primary: #2d3436;
    --text-secondary: #636e72;
    --text-muted: #b2bec3;
    --accent-pink: #fd79a8;
    --accent-purple: #a29bfe;
    --accent-blue: #74b9ff;
    --accent-green: #55efc4;
    --accent-orange: #fab1a0;
    --accent-red: #ff6b6b;
    --accent-yellow: #ffeaa7;
    --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-medium: 0 4px 24px rgba(0,0,0,0.10);
    --shadow-glow: 0 0 20px rgba(253, 121, 168, 0.15);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --transition-fast: 0.15s ease;
    --transition-normal: 0.25s ease;
    --transition-slow: 0.4s ease;
    --font-primary: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
    --sidebar-width: 340px;
}

/* ---------- Reset & Base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%;
    font-family: var(--font-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
}

body {
    background:
        radial-gradient(ellipse at 20% 50%, rgba(253,121,168,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(162,155,254,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(116,185,255,0.08) 0%, transparent 50%),
        var(--bg-primary);
}

/* ---------- Layout ---------- */
.app-container {
    display: flex;
    width: 100%; height: 100vh;
}

/* ---------- Board Area ---------- */
.board-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
}

.board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    z-index: 10;
}

.board-title {
    font-size: 1.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.board-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.board-canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 30% 40%, rgba(253,121,168,0.04) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(85,239,196,0.04) 0%, transparent 50%),
        var(--bg-secondary);
}

#board-canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* ---------- Status Bar ---------- */
.status-bar {
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 500;
    border-top: 1px solid rgba(0,0,0,0.05);
    transition: background var(--transition-normal), color var(--transition-normal);
}

.status-ok { background: #e8f8f0; color: #00b894; }
.status-warning { background: #fef9e7; color: #f39c12; }
.status-error { background: #fdeaea; color: #e74c3c; }

/* ---------- Sidebar ---------- */
.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border-left: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: -4px 0 20px rgba(0,0,0,0.03);
}

.sidebar-section {
    padding: 16px 20px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}

.sidebar-section h3 {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 10px;
}

/* ---------- File Controls ---------- */
.file-controls {
    display: flex;
    gap: 8px;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-primary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-fast);
    outline: none;
}

.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.btn:active { transform: translateY(0); }

.btn-primary {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    color: white;
}
.btn-primary:hover {
    box-shadow: 0 4px 16px rgba(253,121,168,0.3);
}

.btn-secondary {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid rgba(0,0,0,0.08);
}
.btn-secondary:hover { background: #fff; }

.btn-game {
    background: linear-gradient(135deg, var(--accent-green), #00b894);
    color: white;
    width: 100%;
    justify-content: center;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: var(--radius-md);
}
.btn-game:hover { box-shadow: 0 4px 16px rgba(85,239,196,0.3); }
.btn-game:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.btn-new-game {
    background: linear-gradient(135deg, var(--accent-orange), #e17055);
    color: white;
    width: 100%;
    justify-content: center;
    padding: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    margin-top: 8px;
}
.btn-new-game:hover { box-shadow: 0 4px 16px rgba(250,177,160,0.3); }

/* ---------- File Input ---------- */
.file-input-wrapper {
    position: relative;
    overflow: hidden;
}
.file-input-wrapper input[type="file"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
}

/* ---------- Debug Toggle ---------- */
.toggle-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
}

.toggle-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.toggle-switch {
    position: relative;
    width: 44px; height: 24px;
}

.toggle-switch input {
    opacity: 0; width: 0; height: 0;
}

.toggle-slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #dfe6e9;
    border-radius: 12px;
    cursor: pointer;
    transition: background var(--transition-fast);
}

.toggle-slider::before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: transform var(--transition-fast);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.toggle-switch input:checked + .toggle-slider {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
}

.toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(20px);
}

/* ---------- Game Controls ---------- */
.game-setup {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.game-setup label {
    font-size: 0.85rem;
    color: var(--text-secondary);
}

.game-setup select {
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(0,0,0,0.1);
    font-family: var(--font-primary);
    font-size: 0.85rem;
    background: white;
    outline: none;
}

.current-player {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 8px 0;
}

.last-card {
    margin-top: 8px;
}

.card-display {
    display: inline-block;
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    color: #2d3436;
    font-weight: 600;
    font-size: 0.9rem;
    box-shadow: var(--shadow-soft);
}

.no-card {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-style: italic;
}

/* ---------- Turn History ---------- */
.history-container {
    flex: 1;
    overflow-y: auto;
    padding: 0;
}

.history-list {
    list-style: none;
    padding: 0;
}

.history-entry {
    padding: 8px 20px;
    font-size: 0.82rem;
    line-height: 1.4;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    animation: slideIn 0.3s ease;
}

.history-player {
    font-weight: 600;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ---------- Debug Panel ---------- */
.debug-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height var(--transition-slow);
    background: #fafafa;
    border-top: 1px solid rgba(0,0,0,0.05);
}

.debug-panel.visible {
    max-height: 300px;
    overflow-y: auto;
}

.debug-section {
    padding: 12px 20px;
}

.debug-section h3 {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
}

.debug-section ul {
    list-style: none;
    padding: 0;
}

.debug-section li {
    font-size: 0.8rem;
    padding: 4px 0;
    line-height: 1.4;
    color: var(--text-secondary);
}

.debug-errors h3 { color: #e74c3c; }
.debug-warnings h3 { color: #f39c12; }
.debug-tips h3 { color: #0984e3; }
.debug-tips li { color: var(--text-secondary); }

.debug-success {
    text-align: center;
    padding: 20px;
}

.debug-success h3 {
    color: #00b894;
    margin: 6px 0 4px;
}

.debug-success p {
    font-size: 0.82rem;
    color: var(--text-secondary);
}

.debug-icon {
    font-size: 1.1rem;
    vertical-align: middle;
}

/* ---------- Branch Modal ---------- */
.modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal);
}

.modal-overlay.visible {
    opacity: 1;
    pointer-events: all;
}

.modal-card {
    background: white;
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    max-width: 380px;
    width: 90%;
    box-shadow: var(--shadow-medium);
    text-align: center;
    animation: modalPop 0.3s ease;
}

@keyframes modalPop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.modal-card h2 {
    font-size: 1.2rem;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.modal-card p {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 16px;
}

.branch-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 2px solid rgba(0,0,0,0.08);
    border-radius: var(--radius-md);
    background: var(--bg-secondary);
    font-family: var(--font-primary);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.branch-btn:hover {
    background: white;
    border-color: var(--accent-purple);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
}

.branch-id {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent-purple);
    color: white;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
}

.branch-name {
    font-weight: 500;
    color: var(--text-primary);
}

/* ---------- Win Banner ---------- */
.win-banner {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: white;
    border-radius: var(--radius-xl);
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    z-index: 1001;
    opacity: 0;
    pointer-events: none;
    transition: all var(--transition-slow);
}

.win-banner.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: all;
}

.win-banner .win-emoji {
    font-size: 3rem;
    margin-bottom: 8px;
}

.win-banner h2 {
    font-size: 1.6rem;
    background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange), var(--accent-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
}

.win-banner p {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-bottom: 16px;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
    .app-container {
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
        max-height: 40vh;
        border-left: none;
        border-top: 1px solid rgba(0,0,0,0.06);
    }
    .board-canvas-container {

    }

@media (max-width: 600px) {
    .board-header {
        flex-direction: column;
        gap: 8px;
        padding: 8px 12px;
    }
    .board-title {

    }
    :root {
        --sidebar-width: 100%;
    }
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

    <script>
/**
 * board-loader.js
 * Parses and validates a Linked List Candyland board JSON file.
 * Detects orphan nodes, broken pointers, and cycles.
 */

class BoardLoader {
    constructor() {
        this.nodes = new Map();       // id → node object
        this.zones = {};              // zone definitions
        this.head = null;             // head node id
        this.title = '';
        this.errors = [];             // validation errors
        this.warnings = [];           // validation warnings
        this.reachable = new Set();   // ids reachable from HEAD
    }

    /**
     * Load board data from a JSON object.
     * @param {Object} data - Parsed JSON board data
     * @returns {{ success: boolean, errors: string[], warnings: string[] }}
     */
    load(data) {
        this.nodes.clear();
        this.zones = {};
        this.head = null;
        this.title = '';
        this.errors = [];
        this.warnings = [];
        this.reachable.clear();

        // --- Basic structure validation ---
        if (!data || typeof data !== 'object') {
            this.errors.push('Board data must be a JSON object.');
            return this._result();
        }

        this.title = data.title || 'Untitled Board';
        this.zones = data.zones || {};

        if (data.head === undefined || data.head === null) {
            this.errors.push('Missing "head" field — which node is the start of the list?');
            return this._result();
        }
        this.head = data.head;

        if (!Array.isArray(data.nodes) || data.nodes.length === 0) {
            this.errors.push('Missing or empty "nodes" array.');
            return this._result();
        }

        // --- Parse nodes ---
        const seenIds = new Set();
        for (const raw of data.nodes) {
            if (raw.id === undefined || raw.id === null) {
                this.errors.push('A node is missing its "id" field.');
                continue;
            }
            if (seenIds.has(raw.id)) {
                this.errors.push(`Duplicate node id: ${raw.id}`);
                continue;
            }
            seenIds.add(raw.id);

            const node = {
                id: raw.id,
                color: (raw.color || 'gray').toLowerCase(),
                name: raw.name || `Node ${raw.id}`,
                zone: raw.zone || null,
                next: Array.isArray(raw.next) ? [...raw.next] : (raw.next !== undefined ? [raw.next] : []),
                x: typeof raw.x === 'number' ? raw.x : null,
                y: typeof raw.y === 'number' ? raw.y : null,
                // runtime fields filled during validation
                isOrphan: false,
                hasBrokenPointer: false,
                brokenPointers: [],
                inCycle: false,
            };

            this.nodes.set(node.id, node);
        }

        // --- Validate HEAD exists ---
        if (!this.nodes.has(this.head)) {
            this.errors.push(`HEAD points to node ${this.head}, which doesn't exist.`);
        }

        // --- Validate next pointers ---
        for (const [id, node] of this.nodes) {
            for (const nextId of node.next) {
                if (!this.nodes.has(nextId)) {
                    node.hasBrokenPointer = true;
                    node.brokenPointers.push(nextId);
                    this.errors.push(
                        `Node ${id} ("${node.name}") has a NEXT pointer to node ${nextId}, which doesn't exist. ` +
                        `This is like having a pointer to freed memory!`
                    );
                }
            }
        }

        // --- Reachability analysis (BFS from HEAD) ---
        if (this.nodes.has(this.head)) {
            this._computeReachability();
        }

        // --- Mark orphans ---
        for (const [id, node] of this.nodes) {
            if (!this.reachable.has(id)) {
                node.isOrphan = true;
                this.warnings.push(
                    `Node ${id} ("${node.name}") is an ORPHAN — nothing points to it from HEAD. ` +
                    `It's allocated in memory but unreachable. This is a memory leak!`
                );
            }
        }

        // --- Cycle detection ---
        this._detectCycles();

        // --- Zone validation ---
        for (const [id, node] of this.nodes) {
            if (node.zone && !this.zones[node.zone]) {
                this.warnings.push(
                    `Node ${id} ("${node.name}") references zone "${node.zone}" which isn't defined in the zones object.`
                );
            }
        }

        // --- Terminal node check ---
        const terminals = [...this.nodes.values()].filter(n => n.next.length === 0 && this.reachable.has(n.id));
        if (terminals.length === 0 && this.nodes.size > 0 && this.reachable.size > 0) {
            this.warnings.push(
                'No terminal node (NULL pointer) found! Every reachable node has a NEXT pointer. ' +
                'The list might be an infinite loop.'
            );
        }

        return this._result();
    }

    /**
     * Load board data from a JSON string.
     * @param {string} jsonString
     */
    loadFromString(jsonString) {
        try {
            const data = JSON.parse(jsonString);
            return this.load(data);
        } catch (e) {
            this.errors.push(`JSON parse error: ${e.message}`);
            return this._result();
        }
    }

    /**
     * Load board data from a file via fetch.
     * @param {string} url
     */
    async loadFromUrl(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                this.errors.push(`Failed to load file: ${response.status} ${response.statusText}`);
                return this._result();
            }
            const data = await response.json();
            return this.load(data);
        } catch (e) {
            this.errors.push(`Failed to load board data: ${e.message}`);
            return this._result();
        }
    }

    /**
     * BFS from HEAD to find all reachable nodes.
     */
    _computeReachability() {
        const queue = [this.head];
        this.reachable.add(this.head);

        while (queue.length > 0) {
            const currentId = queue.shift();
            const node = this.nodes.get(currentId);
            if (!node) continue;

            for (const nextId of node.next) {
                if (this.nodes.has(nextId) && !this.reachable.has(nextId)) {
                    this.reachable.add(nextId);
                    queue.push(nextId);
                }
            }
        }
    }

    /**
     * Detect cycles using DFS with coloring.
     */
    _detectCycles() {
        const WHITE = 0, GRAY = 1, BLACK = 2;
        const color = new Map();
        for (const id of this.nodes.keys()) {
            color.set(id, WHITE);
        }

        const cycleNodes = new Set();

        const dfs = (id, path) => {
            color.set(id, GRAY);
            path.push(id);
            const node = this.nodes.get(id);

            for (const nextId of node.next) {
                if (!this.nodes.has(nextId)) continue;

                if (color.get(nextId) === GRAY) {
                    // Found a cycle — mark all nodes in the cycle
                    const cycleStart = path.indexOf(nextId);
                    for (let i = cycleStart; i < path.length; i++) {
                        cycleNodes.add(path[i]);
                    }
                } else if (color.get(nextId) === WHITE) {
                    dfs(nextId, path);
                }
            }

            path.pop();
            color.set(id, BLACK);
        };

        // Start DFS from HEAD if it exists
        if (this.nodes.has(this.head)) {
            dfs(this.head, []);
        }

        // Also check orphan subgraphs
        for (const id of this.nodes.keys()) {
            if (color.get(id) === WHITE) {
                dfs(id, []);
            }
        }

        for (const id of cycleNodes) {
            const node = this.nodes.get(id);
            node.inCycle = true;
        }

        if (cycleNodes.size > 0) {
            const names = [...cycleNodes].map(id => {
                const n = this.nodes.get(id);
                return `${id} ("${n.name}")`;
            }).join(', ');
            this.errors.push(
                `Cycle detected! The following nodes form an infinite loop: ${names}. ` +
                `Following NEXT pointers will never reach NULL.`
            );
        }
    }

    /**
     * Get the traversal order from HEAD, following the first next pointer at each branch.
     * Returns an array of node ids.
     */
    getTraversalOrder() {
        const order = [];
        const visited = new Set();
        let currentId = this.head;

        while (currentId !== null && currentId !== undefined) {
            if (visited.has(currentId)) break; // avoid infinite loop
            visited.add(currentId);
            order.push(currentId);

            const node = this.nodes.get(currentId);
            if (!node || node.next.length === 0) break;
            currentId = node.next[0]; // follow first pointer
        }

        return order;
    }

    /**
     * Get all nodes reachable from a given node, in order.
     */
    getPathFrom(startId) {
        const path = [];
        const visited = new Set();
        let currentId = startId;

        while (currentId !== null && currentId !== undefined) {
            if (visited.has(currentId)) break;
            visited.add(currentId);
            path.push(currentId);

            const node = this.nodes.get(currentId);
            if (!node || node.next.length === 0) break;
            currentId = node.next[0];
        }

        return path;
    }

    _result() {
        return {
            success: this.errors.length === 0,
            errors: [...this.errors],
            warnings: [...this.warnings],
        };
    }
}

    <script>
/**
 * board-renderer.js
 * Renders the linked list board on a canvas element.
 */

class BoardRenderer {
    constructor(canvas, loader) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.loader = loader;
        this.debugMode = false;
        this.NODE_RADIUS = 28;
        this.ARROW_HEAD_SIZE = 10;
        this.PADDING = 60;

        this.COLOR_MAP = {
            red:    { fill: '#ff6b6b', stroke: '#d63031', glow: '#ff8787' },
            blue:   { fill: '#74b9ff', stroke: '#0984e3', glow: '#a0d2ff' },
            yellow: { fill: '#ffeaa7', stroke: '#fdcb6e', glow: '#fff3c4' },
            green:  { fill: '#55efc4', stroke: '#00b894', glow: '#81f5d8' },
            purple: { fill: '#a29bfe', stroke: '#6c5ce7', glow: '#c3bfff' },
            orange: { fill: '#fab1a0', stroke: '#e17055', glow: '#fcc8b8' },
            gray:   { fill: '#b2bec3', stroke: '#636e72', glow: '#d5dde0' },
        };

        this.hoverNode = null;
        this.selectedNode = null;
        this.playerPositions = {};  // playerId -> nodeId
        this.playerColors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
        this.pulsePhase = 0;
        this._mouseX = 0;
        this._mouseY = 0;
        this._nodePositions = new Map();

        this.canvas.addEventListener('mousemove', (e) => this._onMouseMove(e));
        this.canvas.addEventListener('click', (e) => this._onClick(e));

        this._animating = true;
        this._lastTime = 0;
        this._startAnimation();
    }

    setDebugMode(enabled) { this.debugMode = enabled; }

    _toCanvasCoords(nx, ny) {
        const w = this.canvas.width, h = this.canvas.height;
        return {
            x: this.PADDING + nx * (w - 2 * this.PADDING),
            y: this.PADDING + ny * (h - 2 * this.PADDING),
        };
    }

    _computePositions() {
        this._nodePositions.clear();
        const hasManual = [...this.loader.nodes.values()].some(n => n.x !== null && n.y !== null);
        if (hasManual) {
            for (const [id, node] of this.loader.nodes) {
                if (node.x !== null && node.y !== null) {
                    this._nodePositions.set(id, this._toCanvasCoords(node.x, node.y));
                }
            }
            const unpos = [...this.loader.nodes.values()].filter(n => n.x === null || n.y === null);
            if (unpos.length > 0) this._autoLayoutNodes(unpos);
        } else {
            this._autoLayoutNodes([...this.loader.nodes.values()]);
        }
    }

    _autoLayoutNodes(nodes) {
        const cols = Math.ceil(Math.sqrt(nodes.length * 1.5));
        nodes.forEach((node, i) => {
            const row = Math.floor(i / cols);
            const col = row % 2 === 0 ? (i % cols) : (cols - 1 - (i % cols));
            const rows = Math.ceil(nodes.length / cols);
            this._nodePositions.set(node.id, this._toCanvasCoords((col + 0.5) / cols, (row + 0.5) / rows));
        });
    }

    render(timestamp) {
        const dt = timestamp - this._lastTime;
        this._lastTime = timestamp;
        this.pulsePhase += dt * 0.003;
        const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (this._nodePositions.size === 0) this._computePositions();
        this._drawZones(ctx);
        this._drawArrows(ctx);
        this._drawNodes(ctx, timestamp);
        this._drawHeadMarker(ctx);
        this._drawPlayerTokens(ctx);
        if (this.hoverNode !== null) this._drawTooltip(ctx);
    }

    _drawZones(ctx) {
        const zoneNodes = {};
        for (const [id, node] of this.loader.nodes) {
            if (!node.zone) continue;
            if (!zoneNodes[node.zone]) zoneNodes[node.zone] = [];
            const pos = this._nodePositions.get(id);
            if (pos) zoneNodes[node.zone].push(pos);
        }
        for (const [zoneName, positions] of Object.entries(zoneNodes)) {
            if (positions.length === 0) continue;
            const zoneDef = this.loader.zones[zoneName];
            const color = zoneDef ? zoneDef.color : '#f0f0f0';
            const pad = 50;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of positions) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = color;
            ctx.beginPath();
            this._roundRect(ctx, minX - pad, minY - pad, maxX - minX + 2 * pad, maxY - minY + 2 * pad, 20);
            ctx.fill();
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
            ctx.save();
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = zoneDef ? zoneDef.accent : '#888';
            ctx.font = 'bold 13px "Fredoka", "Comic Sans MS", cursive';
            ctx.textAlign = 'center';
            ctx.fillText(zoneName, (minX + maxX) / 2, minY - pad + 16);
            ctx.restore();
        }
    }

    _drawArrows(ctx) {
        for (const [id, node] of this.loader.nodes) {
            const fromPos = this._nodePositions.get(id);
            if (!fromPos) continue;
            for (let i = 0; i < node.next.length; i++) {
                const nextId = node.next[i];
                const toPos = this._nodePositions.get(nextId);
                if (!toPos) {
                    if (this.debugMode) this._drawBrokenArrow(ctx, fromPos, nextId);
                    continue;
                }
                const isBranch = node.next.length > 1;
                const dx = toPos.x - fromPos.x, dy = toPos.y - fromPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist === 0) continue;
                const nx = dx / dist, ny = dy / dist;
                const sx = fromPos.x + nx * (this.NODE_RADIUS + 4), sy = fromPos.y + ny * (this.NODE_RADIUS + 4);
                const ex = toPos.x - nx * (this.NODE_RADIUS + 4), ey = toPos.y - ny * (this.NODE_RADIUS + 4);
                ctx.save();
                if (this.debugMode && node.inCycle && this.loader.nodes.get(nextId)?.inCycle) {
                    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3; ctx.setLineDash([8, 4]);
                } else if (isBranch) {
                    ctx.strokeStyle = i === 0 ? '#e17055' : '#00b894'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = '#636e72'; ctx.lineWidth = 2; ctx.setLineDash([]);
                }
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                if (isBranch) {
                    const cs = (i === 0 ? -1 : 1) * 30;
                    const cpX = (sx + ex) / 2 + (-ny) * cs, cpY = (sy + ey) / 2 + nx * cs;
                    ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cpX, cpY, ex, ey);
                } else {
                    ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
                }
                ctx.stroke();
                // Arrowhead
                let aa = Math.atan2(ey - sy, ex - sx);
                if (isBranch) {
                    const cs = (i === 0 ? -1 : 1) * 30;
                    const cpX = (sx + ex) / 2 + (-ny) * cs, cpY = (sy + ey) / 2 + nx * cs;
                    aa = Math.atan2(ey - cpY, ex - cpX);
                }
                ctx.fillStyle = ctx.strokeStyle; ctx.globalAlpha = 0.85;
                ctx.beginPath(); ctx.moveTo(ex, ey);
                ctx.lineTo(ex - this.ARROW_HEAD_SIZE * Math.cos(aa - Math.PI / 6), ey - this.ARROW_HEAD_SIZE * Math.sin(aa - Math.PI / 6));
                ctx.lineTo(ex - this.ARROW_HEAD_SIZE * Math.cos(aa + Math.PI / 6), ey - this.ARROW_HEAD_SIZE * Math.sin(aa + Math.PI / 6));
                ctx.closePath(); ctx.fill();
                // NEXT label
                ctx.globalAlpha = 0.5; ctx.fillStyle = '#2d3436'; ctx.font = '9px "Fredoka", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const la = Math.atan2(dy, dx);
                ctx.fillText('NEXT', (sx + ex) / 2 - Math.sin(la) * 12, (sy + ey) / 2 + Math.cos(la) * 12);
                ctx.restore();
            }
            if (node.next.length === 0) this._drawNullTerminator(ctx, fromPos);
        }
    }

    _drawNullTerminator(ctx, pos) {
        const y = pos.y + this.NODE_RADIUS + 18;
        ctx.save();
        ctx.strokeStyle = '#636e72'; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(pos.x, pos.y + this.NODE_RADIUS + 4); ctx.lineTo(pos.x, y - 4); ctx.stroke();
        ctx.fillStyle = '#636e72'; ctx.beginPath(); ctx.moveTo(pos.x, y - 4); ctx.lineTo(pos.x - 5, y - 10); ctx.lineTo(pos.x + 5, y - 10); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 11px "Fredoka", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.globalAlpha = 0.8;
        ctx.fillText('NULL', pos.x, y);
        ctx.restore();
    }

    _drawBrokenArrow(ctx, fromPos, toId) {
        ctx.save();
        const x = fromPos.x + this.NODE_RADIUS + 15, y = fromPos.y;
        ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.moveTo(fromPos.x + this.NODE_RADIUS + 4, fromPos.y); ctx.lineTo(x + 20, y); ctx.stroke();
        const ex = x + 25; ctx.lineWidth = 3; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(ex - 5, y - 5); ctx.lineTo(ex + 5, y + 5); ctx.moveTo(ex + 5, y - 5); ctx.lineTo(ex - 5, y + 5); ctx.stroke();
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 9px "Fredoka", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(`-> ${toId} (missing!)`, ex + 10, y);
        ctx.restore();
    }

    _drawNodes(ctx, timestamp) {
        for (const [id, node] of this.loader.nodes) {
            const pos = this._nodePositions.get(id);
            if (!pos) continue;
            this._drawSingleNode(ctx, node, pos, this.hoverNode === id, this.debugMode && node.isOrphan, this.debugMode && node.inCycle, this.debugMode && node.hasBrokenPointer);
        }
    }

    _drawSingleNode(ctx, node, pos, isHovered, isOrphan, isCycle, isBroken) {
        const r = this.NODE_RADIUS;
        const colors = this.COLOR_MAP[node.color] || this.COLOR_MAP.gray;
        ctx.save();
        if (isHovered) { ctx.translate(pos.x, pos.y); ctx.scale(1.15, 1.15); ctx.translate(-pos.x, -pos.y); }
        if (isOrphan) ctx.globalAlpha = 0.4;
        if (isHovered || isCycle || isBroken) {
            const gc = isCycle || isBroken ? '#e74c3c' : colors.glow;
            const ps = isCycle || isBroken ? r + 8 + Math.sin(this.pulsePhase * 3) * 4 : r + 6;
            ctx.beginPath(); ctx.arc(pos.x, pos.y, ps, 0, Math.PI * 2); ctx.fillStyle = gc; ctx.globalAlpha = isOrphan ? 0.15 : 0.25; ctx.fill(); ctx.globalAlpha = isOrphan ? 0.4 : 1.0;
        }
        ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
        const grad = ctx.createRadialGradient(pos.x - r * 0.3, pos.y - r * 0.3, r * 0.1, pos.x, pos.y, r);
        grad.addColorStop(0, colors.glow); grad.addColorStop(1, colors.fill);
        ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.strokeStyle = isOrphan ? '#95a5a6' : (isCycle || isBroken ? '#e74c3c' : colors.stroke); ctx.lineWidth = isHovered ? 3 : 2;
        if (isCycle) ctx.setLineDash([6, 3]);
        ctx.stroke(); ctx.setLineDash([]);
        // Shine
        ctx.beginPath(); ctx.arc(pos.x - r * 0.25, pos.y - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
        // ID
        ctx.fillStyle = '#2d3436'; ctx.font = `bold ${r * 0.65}px "Fredoka", "Comic Sans MS", cursive`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(node.id), pos.x, pos.y);
        // Name
        ctx.fillStyle = isOrphan ? '#95a5a6' : '#2d3436'; ctx.font = `${Math.max(9, r * 0.35)}px "Fredoka", "Comic Sans MS", cursive`; ctx.textBaseline = 'top';
        ctx.fillText(node.name, pos.x, pos.y + r + 4, 100);
        // Debug badges
        if (isOrphan) { ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#e67e22'; ctx.textBaseline = 'middle'; ctx.fillText('⚠️', pos.x + r + 2, pos.y - r + 2); }
        if (isCycle) { ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = '#e74c3c'; ctx.textBaseline = 'middle'; ctx.fillText('🔄', pos.x + r + 2, pos.y); }
        ctx.restore();
    }

    _drawHeadMarker(ctx) {
        const headPos = this._nodePositions.get(this.loader.head);
        if (!headPos) return;
        const x = headPos.x, y = headPos.y - this.NODE_RADIUS - 28;
        const bounce = Math.sin(this.pulsePhase * 2) * 3;
        ctx.save();
        ctx.fillStyle = '#e74c3c'; ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.moveTo(x, y + 16 + bounce); ctx.lineTo(x - 8, y + 6 + bounce); ctx.lineTo(x + 8, y + 6 + bounce); ctx.closePath(); ctx.fill();
        ctx.font = 'bold 14px "Fredoka", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('HEAD', x, y + 4 + bounce);
        ctx.restore();
    }

    _drawPlayerTokens(ctx) {
        let idx = 0;
        for (const [playerId, nodeId] of Object.entries(this.playerPositions)) {
            const pos = this._nodePositions.get(nodeId);
            if (!pos) continue;
            const color = this.playerColors[idx % this.playerColors.length];
            const offset = (idx - Object.keys(this.playerPositions).length / 2) * 14;
            const tx = pos.x + offset, ty = pos.y - this.NODE_RADIUS - 8;
            ctx.save();
            ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(tx, ty, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(String(parseInt(playerId) + 1), tx, ty);
            ctx.restore();
            idx++;
        }
    }

    _drawTooltip(ctx) {
        const node = this.loader.nodes.get(this.hoverNode);
        if (!node) return;
        const pos = this._nodePositions.get(this.hoverNode);
        if (!pos) return;
        const lines = [`ID: ${node.id}`, `Name: ${node.name}`, `Color: ${node.color}`, `Zone: ${node.zone || 'none'}`, `Next: ${node.next.length === 0 ? 'NULL' : node.next.join(', ')}`];
        if (this.debugMode) {
            if (node.isOrphan) lines.push('⚠ ORPHAN — unreachable from HEAD');
            if (node.inCycle) lines.push('CYCLE detected');
            if (node.hasBrokenPointer) lines.push(`Broken ptr: ${node.brokenPointers.join(', ')}`);
        }
        const pad = 10, lh = 18, tw = 220, th = lines.length * lh + pad * 2;
        let tipX = pos.x + this.NODE_RADIUS + 15, tipY = pos.y - th / 2;
        if (tipX + tw > this.canvas.width) tipX = pos.x - this.NODE_RADIUS - 15 - tw;
        if (tipY < 5) tipY = 5;
        if (tipY + th > this.canvas.height - 5) tipY = this.canvas.height - 5 - th;
        ctx.save();
        ctx.fillStyle = 'rgba(45, 52, 54, 0.92)'; ctx.beginPath(); this._roundRect(ctx, tipX, tipY, tw, th, 8); ctx.fill();
        ctx.fillStyle = '#dfe6e9'; ctx.font = '13px "Fredoka", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        lines.forEach((line, i) => ctx.fillText(line, tipX + pad, tipY + pad + i * lh));
        ctx.restore();
    }

    _roundRect(ctx, x, y, w, h, r) {
        ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }

    _onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        this._mouseX = (e.clientX - rect.left) * (this.canvas.width / rect.width);
        this._mouseY = (e.clientY - rect.top) * (this.canvas.height / rect.height);
        this.hoverNode = null;
        for (const [id, pos] of this._nodePositions) {
            const dx = this._mouseX - pos.x, dy = this._mouseY - pos.y;
            if (dx * dx + dy * dy <= this.NODE_RADIUS * this.NODE_RADIUS * 1.3) { this.hoverNode = id; this.canvas.style.cursor = 'pointer'; return; }
        }
        this.canvas.style.cursor = 'default';
    }

    _onClick(e) {
        if (this.hoverNode !== null) {
            this.selectedNode = this.hoverNode;
            this.canvas.dispatchEvent(new CustomEvent('nodeclick', { detail: { nodeId: this.hoverNode } }));
        }
    }

    _startAnimation() {
        const loop = (ts) => { if (!this._animating) return; this.render(ts); requestAnimationFrame(loop); };
        requestAnimationFrame(loop);
    }

    destroy() { this._animating = false; }
    invalidateLayout() { this._nodePositions.clear(); }
    getNodePosition(nodeId) { return this._nodePositions.get(nodeId) || null; }
}

    <script>
/**
 * game-engine.js
 * Implements Candyland card-draw gameplay on the linked list board.
 */

class GameEngine {
    constructor(loader) {
        this.loader = loader;
        this.players = [];
        this.currentPlayerIndex = 0;
        this.deck = [];
        this.discardPile = [];
        this.turnHistory = [];
        this.gameOver = false;
        this.winner = null;
        this.onStateChange = null;  // callback
        this.onBranchChoice = null; // callback(nodeId, options) -> Promise<chosenNextId>
    }

    /**
     * Initialize a new game.
     * @param {number} numPlayers - 1 to 4
     */
    init(numPlayers) {
        this.players = [];
        for (let i = 0; i < Math.min(numPlayers, 4); i++) {
            this.players.push({
                id: i,
                name: `Player ${i + 1}`,
                position: this.loader.head,
                finished: false,
            });
        }
        this.currentPlayerIndex = 0;
        this.gameOver = false;
        this.winner = null;
        this.turnHistory = [];
        this._buildDeck();
        this._shuffleDeck();
        this._notify();
    }

    /**
     * Build the card deck: 10 cards of each of the 6 colors, plus 4 special "double" cards.
     */
    _buildDeck() {
        this.deck = [];
        this.discardPile = [];
        const colors = ['red', 'blue', 'yellow', 'green', 'purple', 'orange'];
        for (const color of colors) {
            for (let i = 0; i < 10; i++) {
                this.deck.push({ type: 'single', color });
            }
            // 2 double cards per color — advance to the SECOND matching color
            this.deck.push({ type: 'double', color });
            this.deck.push({ type: 'double', color });
        }
    }

    _shuffleDeck() {
        for (let i = this.deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
        }
    }

    /**
     * Draw a card for the current player and advance them.
     * Returns the drawn card and movement result.
     */
    async drawCard() {
        if (this.gameOver) return null;

        const player = this.players[this.currentPlayerIndex];
        if (player.finished) {
            this._advanceTurn();
            return this.drawCard();
        }

        // Reshuffle if deck empty
        if (this.deck.length === 0) {
            this.deck = [...this.discardPile];
            this.discardPile = [];
            this._shuffleDeck();
        }

        const card = this.deck.pop();
        this.discardPile.push(card);

        // Find the target node
        const result = await this._findTarget(player, card);

        const entry = {
            player: player.name,
            playerId: player.id,
            card: card,
            from: player.position,
            to: result.targetNode,
            path: result.path,
            message: result.message,
        };
        this.turnHistory.push(entry);

        // Move the player
        if (result.targetNode !== null) {
            player.position = result.targetNode;

            // Check for win (reached a NULL-terminating node)
            const targetNodeObj = this.loader.nodes.get(result.targetNode);
            if (targetNodeObj && targetNodeObj.next.length === 0) {
                player.finished = true;
                if (!this.winner) {
                    this.winner = player;
                    this.gameOver = true;
                    entry.message += ` 🎉 ${player.name} wins!`;
                }
            }
        }

        this._advanceTurn();
        this._notify();
        return entry;
    }

    /**
     * Find the next node of the matching color by traversing the linked list.
     */
    async _findTarget(player, card) {
        const visited = new Set();
        let current = player.position;
        let matchesNeeded = card.type === 'double' ? 2 : 1;
        let matchCount = 0;
        const path = [current];

        while (true) {
            const node = this.loader.nodes.get(current);
            if (!node || node.next.length === 0) {
                return { targetNode: current, path, message: `Drew ${card.color} ${card.type} — no more ${card.color} spaces ahead. Stayed at ${node?.name || 'unknown'}.` };
            }

            // Handle branches
            let nextId;
            if (node.next.length > 1) {
                if (this.onBranchChoice) {
                    nextId = await this.onBranchChoice(current, node.next);
                } else {
                    nextId = node.next[0]; // default to first branch
                }
            } else {
                nextId = node.next[0];
            }

            if (visited.has(nextId)) {
                return { targetNode: current, path, message: `Drew ${card.color} ${card.type} — hit a cycle! Stayed at ${node.name}.` };
            }
            visited.add(nextId);
            current = nextId;
            path.push(current);

            const nextNode = this.loader.nodes.get(current);
            if (nextNode && nextNode.color === card.color) {
                matchCount++;
                if (matchCount >= matchesNeeded) {
                    const traversalText = path.map(id => id).join(' → ');
                    return {
                        targetNode: current,
                        path,
                        message: `Drew ${card.color} ${card.type} — traversed ${traversalText} to reach "${nextNode.name}".`
                    };
                }
            }

            if (!nextNode || nextNode.next.length === 0) {
                return { targetNode: current, path, message: `Drew ${card.color} ${card.type} — reached end of list at "${nextNode?.name || 'unknown'}" without finding ${card.color}.` };
            }
        }
    }

    _advanceTurn() {
        if (this.gameOver) return;
        let tries = 0;
        do {
            this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
            tries++;
        } while (this.players[this.currentPlayerIndex].finished && tries < this.players.length);

        if (tries >= this.players.length) {
            this.gameOver = true;
        }
    }

    getCurrentPlayer() {
        return this.players[this.currentPlayerIndex];
    }

    getPlayerPositions() {
        const positions = {};
        for (const p of this.players) {
            positions[p.id] = p.position;
        }
        return positions;
    }

    _notify() {
        if (this.onStateChange) this.onStateChange();
    }
}

    <script>
/**
 * debug-overlay.js
 * Provides a debug/error panel for student boards.
 */

class DebugOverlay {
    constructor(loader, panelElement) {
        this.loader = loader;
        this.panel = panelElement;
    }

    /**
     * Refresh the debug panel with current errors and warnings.
     */
    refresh() {
        if (!this.panel) return;
        const errors = this.loader.errors;
        const warnings = this.loader.warnings;

        if (errors.length === 0 && warnings.length === 0) {
            this.panel.innerHTML = `
                <div class="debug-success">
                    <span class="debug-icon">✅</span>
                    <h3>All Clear!</h3>
                    <p>Your linked list looks correct. No orphan nodes, broken pointers, or cycles detected.</p>
                </div>`;
            return;
        }

        let html = '';

        if (errors.length > 0) {
            html += '<div class="debug-section debug-errors">';
            html += `<h3><span class="debug-icon">❌</span> Errors (${errors.length})</h3>`;
            html += '<ul>';
            for (const err of errors) {
                html += `<li>${this._escapeHtml(err)}</li>`;
            }
            html += '</ul></div>';
        }

        if (warnings.length > 0) {
            html += '<div class="debug-section debug-warnings">';
            html += `<h3><span class="debug-icon">⚠️</span> Warnings (${warnings.length})</h3>`;
            html += '<ul>';
            for (const warn of warnings) {
                html += `<li>${this._escapeHtml(warn)}</li>`;
            }
            html += '</ul></div>';
        }

        // Add educational tips
        html += '<div class="debug-section debug-tips">';
        html += '<h3><span class="debug-icon">💡</span> Understanding These Errors</h3>';
        html += '<ul>';

        const hasOrphans = warnings.some(w => w.includes('ORPHAN'));
        const hasBroken = errors.some(e => e.includes('NEXT pointer'));
        const hasCycles = errors.some(e => e.includes('Cycle'));

        if (hasOrphans) {
            html += '<li><strong>Orphan Nodes</strong> are like malloc\'d memory that nothing points to — a <em>memory leak</em>. Make sure every node is reachable by following NEXT pointers from HEAD.</li>';
        }
        if (hasBroken) {
            html += '<li><strong>Broken Pointers</strong> are like dangling pointers in C++ — your node\'s <code>next</code> field points to a node ID that doesn\'t exist. Check your node IDs.</li>';
        }
        if (hasCycles) {
            html += '<li><strong>Cycles</strong> mean following NEXT pointers goes in circles forever — you\'ll never reach NULL. This is an <em>infinite loop</em>. Check which node incorrectly points back.</li>';
        }

        html += '</ul></div>';

        this.panel.innerHTML = html;
    }

    _escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
}
    </script>

/**
 * main.js
 * Application initialization and UI wiring for Linked List Candyland.
 */

(function () {
    'use strict';

    let loader, renderer, engine, debugOverlay;

    // DOM references
    const canvas = () => document.getElementById('board-canvas');
    const fileInput = () => document.getElementById('file-input');
    const loadSampleBtn = () => document.getElementById('load-sample');
    const debugToggle = () => document.getElementById('debug-toggle');
    const debugPanel = () => document.getElementById('debug-panel');
    const drawCardBtn = () => document.getElementById('draw-card');
    const newGameBtn = () => document.getElementById('new-game');
    const playerCountSelect = () => document.getElementById('player-count');
    const currentPlayerEl = () => document.getElementById('current-player');
    const lastCardEl = () => document.getElementById('last-card');
    const historyList = () => document.getElementById('history-list');
    const boardTitle = () => document.getElementById('board-title');
    const statusBar = () => document.getElementById('status-bar');
    const branchModal = () => document.getElementById('branch-modal');
    const branchOptions = () => document.getElementById('branch-options');
    const winBanner = () => document.getElementById('win-banner');
    const winMessage = () => document.getElementById('win-message');

    /**
     * Initialize the app.
     */
    function init() {
        loader = new BoardLoader();

        // Set up canvas sizing
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Load sample board button — uses embedded data, no fetch needed
        loadSampleBtn().addEventListener('click', () => {
            const result = loader.load(SAMPLE_BOARD_DATA);
            onBoardLoaded(result);
        });

        // File input
        fileInput().addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const result = loader.loadFromString(evt.target.result);
                onBoardLoaded(result);
            };
            reader.readAsText(file);
        });

        // Debug toggle
        debugToggle().addEventListener('change', (e) => {
            const on = e.target.checked;
            if (renderer) renderer.setDebugMode(on);
            debugPanel().classList.toggle('visible', on);
            if (on && debugOverlay) debugOverlay.refresh();
        });

        // Draw card
        drawCardBtn().addEventListener('click', async () => {
            if (!engine || engine.gameOver) return;
            drawCardBtn().disabled = true;
            const entry = await engine.drawCard();
            if (entry) {
                updateGameUI(entry);
                if (renderer) renderer.playerPositions = engine.getPlayerPositions();
            }
            drawCardBtn().disabled = false;
        });

        // New game
        newGameBtn().addEventListener('click', () => {
            startNewGame();
        });

        // Auto-load sample board
        loadSampleBtn().click();
    }

    /**
     * Handle a loaded board.
     */
    function onBoardLoaded(result) {
        boardTitle().textContent = loader.title;

        if (renderer) renderer.destroy();
        renderer = new BoardRenderer(canvas(), loader);
        renderer.setDebugMode(debugToggle().checked);

        debugOverlay = new DebugOverlay(loader, debugPanel());
        if (debugToggle().checked) debugOverlay.refresh();

        if (result.errors.length > 0) {
            statusBar().textContent = `⚠ Loaded with ${result.errors.length} error(s). Enable Debug Mode to see details.`;
            statusBar().className = 'status-bar status-error';
        } else if (result.warnings.length > 0) {
            statusBar().textContent = `Loaded with ${result.warnings.length} warning(s). Enable Debug Mode to see details.`;
            statusBar().className = 'status-bar status-warning';
        } else {
            statusBar().textContent = `✅ Board loaded successfully — ${loader.nodes.size} nodes, ${Object.keys(loader.zones).length} zones.`;
            statusBar().className = 'status-bar status-ok';
        }

        startNewGame();
    }

    /**
     * Start a new game on the current board.
     */
    function startNewGame() {
        if (!loader || loader.nodes.size === 0) return;

        winBanner().classList.remove('visible');
        const numPlayers = parseInt(playerCountSelect().value) || 2;

        engine = new GameEngine(loader);
        engine.onBranchChoice = handleBranchChoice;
        engine.onStateChange = () => {
            if (renderer) renderer.playerPositions = engine.getPlayerPositions();
        };
        engine.init(numPlayers);

        if (renderer) renderer.playerPositions = engine.getPlayerPositions();

        // Clear UI
        historyList().innerHTML = '';
        lastCardEl().innerHTML = '<span class="no-card">No card drawn yet</span>';
        updateCurrentPlayer();
        drawCardBtn().disabled = false;
    }

    /**
     * Handle branch choice via modal.
     */
    function handleBranchChoice(nodeId, options) {
        return new Promise((resolve) => {
            const node = loader.nodes.get(nodeId);
            branchOptions().innerHTML = '';

            for (const optId of options) {
                const optNode = loader.nodes.get(optId);
                const btn = document.createElement('button');
                btn.className = 'branch-btn';
                btn.innerHTML = `<span class="branch-id">${optId}</span> <span class="branch-name">${optNode ? optNode.name : 'Unknown'}</span>`;
                if (optNode) {
                    btn.style.borderColor = (this?.COLOR_MAP?.[optNode.color]?.stroke) || '#636e72';
                }
                btn.addEventListener('click', () => {
                    branchModal().classList.remove('visible');
                    resolve(optId);
                });
                branchOptions().appendChild(btn);
            }

            branchModal().classList.add('visible');
        });
    }

    /**
     * Update the game UI after a card draw.
     */
    function updateGameUI(entry) {
        // Last card
        const cardColor = entry.card.color;
        const cardType = entry.card.type === 'double' ? '×2' : '';
        lastCardEl().innerHTML = `<span class="card-display" style="background: ${getCardColor(cardColor)}">${capitalize(cardColor)} ${cardType}</span>`;

        // History
        const li = document.createElement('li');
        li.className = 'history-entry';
        li.innerHTML = `<span class="history-player" style="color: ${getPlayerColor(entry.playerId)}">${entry.player}</span>: ${entry.message}`;
        historyList().prepend(li);

        // Current player
        updateCurrentPlayer();

        // Win
        if (engine.gameOver && engine.winner) {
            winMessage().textContent = `${engine.winner.name} reached the end of the linked list!`;
            winBanner().classList.add('visible');
            drawCardBtn().disabled = true;
        }
    }

    function updateCurrentPlayer() {
        if (!engine) return;
        const cp = engine.getCurrentPlayer();
        currentPlayerEl().innerHTML = `<span style="color: ${getPlayerColor(cp.id)}">${cp.name}</span>'s turn`;
    }

    function getPlayerColor(id) {
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
        return colors[id % colors.length];
    }

    function getCardColor(color) {
        const map = { red: '#ff6b6b', blue: '#74b9ff', yellow: '#ffeaa7', green: '#55efc4', purple: '#a29bfe', orange: '#fab1a0' };
        return map[color] || '#b2bec3';
    }

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    /**
     * Resize canvas to fit container.
     */
    function resizeCanvas() {
        const c = canvas();
        if (!c) return;
        const container = c.parentElement;
        const dpr = window.devicePixelRatio || 1;
        c.width = container.clientWidth * dpr;
        c.height = container.clientHeight * dpr;
        c.style.width = container.clientWidth + 'px';
        c.style.height = container.clientHeight + 'px';
        if (renderer) renderer.invalidateLayout();
    }

    // Boot
    document.addEventListener('DOMContentLoaded', init);
})();
    </script>
